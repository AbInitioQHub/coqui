[mean_field.qe]
name     = "mf_qe"
prefix   = "pwscf"
outdir   = "qe_output_dir/OUT/"
filetype = "h5"

[interaction.thc]
name        = "eri"
mean_field  = "mf_qe"
storage     = "incore"
thresh      = 1e-6
chol_block_size = 8
r_blk       = 20
distr_tol   = 0.4

[evgw]
interaction = "eri"
beta      = 2000
lambda    = 1200.0
iaft_prec = "high"
niter     = 1
outdir    = "./"
prefix    = "g0w0"
div_treatment = "gygi"
[evgw.qp_eqn]
solver    = "sc"          # "sc"/"sc_bisection", "sc_newton", "spectral", "linearized"
ac_alg    = "pade"        # the analytic continuation that feeds the equation
eta       = 1e-6          # broadening at which the continued Sigma is evaluated
ac_nfit   = 26            # Matsubara points it fits; -1 = all available
